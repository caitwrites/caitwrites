name = "caitwrites-portfolio"
main = "worker/index.ts"
compatibility_date = "2024-12-18"
assets = { directory = "./dist", binding = "ASSETS", not_found_handling = "single-page-application", run_worker_first = ["/api/*"] }

[[d1_databases]]
binding = "DB"
database_name = "caitwrites-portfolio"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
GOOGLE_SHEET_ID = "10_-eQ_659xyk6ccyl4hLpT--VxaYHVvd1uRADHj68A8"
GOOGLE_SHEET_RANGE = "Combined!A:K"
METADATA_BATCH_SIZE = "8"

[triggers]
crons = ["17 3 * * *"]
